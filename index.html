<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>和敬くんの冒険ギルド</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // React管理のシンプルSVGアイコン
    const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
      const common = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        xmlns: "http://www.w3.org/2000/svg",
        stroke: "currentColor",
        strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className
      };

      switch (name) {
        case "sword":
          return (
            <svg {...common}>
              <path d="M14.5 5.5l4 4" />
              <path d="M5 19l4-4" />
              <path d="M6.5 17.5l10-10" />
              <path d="M12 8l4 4" />
              <path d="M4 20l3-1 1-3-3 1-1 3z" />
            </svg>
          );
        case "star":
          return (
            <svg {...common}>
              <path d="M12 2l2.9 6.1 6.7.6-5 4.3 1.5 6.5L12 16.9 5.9 19.5 7.4 13 2.4 8.7l6.7-.6L12 2z" />
            </svg>
          );
        case "home":
          return (
            <svg {...common}>
              <path d="M3 11l9-8 9 8" />
              <path d="M5 10v10h14V10" />
            </svg>
          );
        case "play":
          return (
            <svg {...common}>
              <path d="M8 5l11 7-11 7V5z" />
            </svg>
          );
        case "settings":
          return (
            <svg {...common}>
              <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
              <path d="M19.4 15a7.8 7.8 0 0 0 .1-2l2-1.2-2-3.5-2.3.7a7.2 7.2 0 0 0-1.7-1l-.3-2.4H9.8L9.5 8a7.2 7.2 0 0 0-1.7 1L5.5 8.3l-2 3.5 2 1.2a7.8 7.8 0 0 0 .1 2l-2 1.2 2 3.5 2.3-.7a7.2 7.2 0 0 0 1.7 1l.3 2.4h4.4l.3-2.4a7.2 7.2 0 0 0 1.7-1l2.3.7 2-3.5-2-1.2z" />
            </svg>
          );
        case "check-circle":
          return (
            <svg {...common}>
              <path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z" />
              <path d="M7 12l3 3 7-7" />
            </svg>
          );
        case "crown":
          return (
            <svg {...common}>
              <path d="M4 8l4 4 4-6 4 6 4-4v10H4V8z" />
              <path d="M4 18h16" />
            </svg>
          );
        default:
          return <span className={className} style={{ width: size, height: size, display: "inline-block" }} />;
      }
    };

    const INITIAL_TASKS = [
      { id: 1, text: "あさごはんを たべる", xp: 50, completed: false, icon: "🍳" },
      { id: 2, text: "はみがきを する", xp: 30, completed: false, icon: "🪥" },
      { id: 3, text: "おきがえを する", xp: 40, completed: false, icon: "👕" },
      { id: 4, text: "おもちゃを かたづける", xp: 60, completed: false, icon: "🧸" },
      { id: 5, text: "しゅくだい/おべんきょう", xp: 100, completed: false, icon: "✏️" },
      { id: 6, text: "おふろに はいる", xp: 50, completed: false, icon: "🛁" },
    ];

    const getGrowthProfile = (level) => {
      if (level >= 10) return { title: "でんせつの ゆうしゃ", accent: "from-fuchsia-500 via-yellow-300 to-emerald-400", frame: "border-fuchsia-400/40", glow: "shadow-[0_0_30px_rgba(217,70,239,0.18)]" };
      if (level >= 7)  return { title: "えいゆう",           accent: "from-indigo-500 via-sky-300 to-emerald-400",   frame: "border-indigo-400/35", glow: "shadow-[0_0_26px_rgba(99,102,241,0.16)]" };
      if (level >= 4)  return { title: "つよい ぼうけんしゃ", accent: "from-blue-500 via-yellow-300 to-orange-400",   frame: "border-blue-400/30",  glow: "shadow-[0_0_22px_rgba(59,130,246,0.15)]" };
      return            { title: "ぼうけんしゃ",              accent: "from-slate-500 via-slate-300 to-slate-200",    frame: "border-slate-400/20", glow: "shadow-[0_0_18px_rgba(148,163,184,0.10)]" };
    };

    const App = () => {
      const [tasks, setTasks] = useState(INITIAL_TASKS);

      // XPは累積
      const [totalXp, setTotalXp] = useState(0);

      // レベルは「派生値」で確定させる（上がらない問題の根本対策）
      const level = useMemo(() => Math.floor(totalXp / 200) + 1, [totalXp]);
      const prevLevelRef = useRef(level);

      const [showLevelUp, setShowLevelUp] = useState(false);

      const completedCount = useMemo(() => tasks.filter(t => t.completed).length, [tasks]);
      const allComplete = completedCount === tasks.length;

      const isMilestone = level % 3 === 0;
      const profile = useMemo(() => getGrowthProfile(level), [level]);

      const avatarUrl = useMemo(() => {
        const seed = `Wake-Lv${level}`;
        return `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(seed)}&backgroundColor=b6e3f4`;
      }, [level]);

      const triggerConfetti = (big = false) => {
        if (!window.confetti) return;
        window.confetti({
          particleCount: big ? 220 : 120,
          spread: big ? 90 : 70,
          origin: { y: 0.65 },
          colors: ["#FFD700", "#60A5FA", "#F97316", "#FFFFFF"]
        });
      };

      // レベルアップ演出（prevLevel比較で確実に発火）
      useEffect(() => {
        const prev = prevLevelRef.current;
        if (level > prev) {
          prevLevelRef.current = level;
          setShowLevelUp(true);
          triggerConfetti(true);
          setTimeout(() => setShowLevelUp(false), 2500);
        }
      }, [level]);

      const toggleTask = (id) => {
        setTasks(prev =>
          prev.map(task => {
            if (task.id === id && !task.completed) {
              setTotalXp(x => x + task.xp);
              triggerConfetti(false);
              return { ...task, completed: true };
            }
            return task;
          })
        );
      };

      const resetQuests = () => {
        if (window.confirm("あしたの ぼうけんに そなえて、クエストを リセットする？")) {
          setTasks(INITIAL_TASKS.map(t => ({ ...t, completed: false })));
        }
      };

      const xpInLevel = totalXp % 200;
      const xpProgress = (xpInLevel / 200) * 100;
      const xpToNext = 200 - xpInLevel;

      return (
        // ここが重要：下部fixedメニューに隠れないよう余白を大きく取る（safe-areaも）
        <div
          className="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 md:p-8 flex justify-center items-start"
          style={{ paddingBottom: "calc(180px + env(safe-area-inset-bottom))" }}
        >
          <div className="max-w-md w-full space-y-6">

            {/* ステータス */}
            <div className={`bg-gradient-to-br from-slate-800 to-slate-900 rounded-[2rem] p-6 shadow-2xl border ${profile.frame} relative overflow-hidden ${profile.glow}`}>
              <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none text-white">
                <Icon name="sword" size={120} />
              </div>

              <div className="flex items-center gap-4 mb-5 relative z-10">
                <div
                  className={`w-20 h-20 rounded-2xl border-4 flex items-center justify-center overflow-hidden transform -rotate-3
                    ${isMilestone ? "border-yellow-400/70 shadow-[0_0_22px_rgba(250,204,21,0.22)]" : "border-slate-700 shadow-inner"}`}
                >
                  <img src={avatarUrl} alt={`Wake Lv${level}`} className="w-full h-full object-cover" />
                </div>

                <div className="min-w-0">
                  <h1 className="text-2xl font-black text-white leading-tight">ゆうしゃ 和敬</h1>

                  <div className="mt-2 flex items-center gap-2 flex-wrap">
                    <div
                      className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border text-sm font-black tracking-wide
                        ${isMilestone
                          ? "bg-gradient-to-r from-yellow-500/25 to-orange-500/15 border-yellow-400/50 text-yellow-200 shadow-[0_0_18px_rgba(250,204,21,0.18)]"
                          : "bg-slate-950/40 border-slate-700 text-slate-100"
                        }`}
                    >
                      {isMilestone && <Icon name="crown" size={16} className="text-yellow-300" />}
                      <span className="tabular-nums">Lv. {level}</span>
                    </div>

                    <div className="text-xs font-black uppercase text-slate-300/90 truncate">
                      {profile.title}
                    </div>
                  </div>
                </div>
              </div>

              <div className="space-y-2 relative z-10">
                <div className="flex justify-between items-end">
                  <div className="text-[11px] font-black uppercase tracking-widest text-slate-300/80">
                    Next Level
                  </div>
                  <div className="text-right">
                    <div className="text-[12px] font-black text-yellow-300 tabular-nums">
                      {xpInLevel} / 200 XP
                    </div>
                    <div className="text-[10px] font-bold text-slate-400 tabular-nums">
                      あと {xpToNext} XP
                    </div>
                  </div>
                </div>

                <div className="h-5 bg-slate-950/55 rounded-full border border-slate-700 p-1">
                  <div
                    className={`h-full rounded-full transition-all duration-700 ${isMilestone ? "shadow-[0_0_18px_rgba(250,204,21,0.22)]" : "shadow-[0_0_15px_rgba(59,130,246,0.18)]"} bg-gradient-to-r ${profile.accent}`}
                    style={{ width: `${xpProgress}%` }}
                  />
                </div>

                {allComplete && (
                  <div className="mt-2 text-xs font-black text-emerald-300">
                    今日のクエスト、ぜんぶクリア！
                  </div>
                )}
              </div>
            </div>

            {/* クエストリスト */}
            <div className="space-y-4">
              <div className="flex justify-between items-end px-2">
                <h2 className="text-2xl font-black text-white">今日のクエスト</h2>
                <div className="bg-slate-800/50 px-4 py-1.5 rounded-xl border border-slate-700 text-sm font-black tabular-nums">
                  {completedCount} / {tasks.length}
                </div>
              </div>

              <div className="grid gap-4">
                {tasks.map((task) => (
                  <button
                    key={task.id}
                    onClick={() => toggleTask(task.id)}
                    disabled={task.completed}
                    className={`group flex items-center p-5 rounded-[1.5rem] border-b-4 transition-all duration-200 active:translate-y-1 active:border-b-0 ${
                      task.completed
                        ? "bg-emerald-950/20 border-emerald-900/10 opacity-70"
                        : "bg-slate-800 border-slate-950"
                    }`}
                  >
                    <div className="text-4xl mr-5 w-16 h-16 flex items-center justify-center rounded-2xl bg-slate-700">
                      {task.icon}
                    </div>

                    <div className="flex-1 text-left min-w-0">
                      <div className={`text-lg font-bold truncate ${task.completed ? "line-through text-slate-500" : "text-slate-100"}`}>
                        {task.text}
                      </div>
                      <div className={`text-xs font-black mt-1 flex items-center gap-1 ${task.completed ? "text-slate-600" : "text-yellow-400"}`}>
                        <Icon name="star" size={14} className="inline-block" />
                        <span className="tabular-nums">+{task.xp} XP</span>
                      </div>
                    </div>

                    {task.completed ? (
                      <div className="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white">
                        <Icon name="check-circle" size={24} className="text-white" strokeWidth={3} />
                      </div>
                    ) : (
                      <div className="w-10 h-10 rounded-full border-4 border-slate-700"></div>
                    )}
                  </button>
                ))}
              </div>
            </div>

            {/* 下部メニュー（safe-area対応で少し上げる） */}
            <div
              className="fixed left-4 right-4 max-w-md mx-auto z-40"
              style={{ bottom: "calc(16px + env(safe-area-inset-bottom))" }}
            >
              <div className="bg-slate-900/80 backdrop-blur-xl rounded-[2.5rem] p-4 border border-slate-700/50 flex justify-around">
                <button className="p-4 bg-blue-600 rounded-2xl text-white">
                  <Icon name="home" size={28} />
                </button>
                <button onClick={resetQuests} className="p-4 text-slate-500">
                  <Icon name="play" size={28} />
                </button>
                <button className="p-4 text-slate-500">
                  <Icon name="settings" size={28} />
                </button>
              </div>
            </div>

            {/* レベルアップ */}
            {showLevelUp && (
              <div className="fixed inset-0 flex items-center justify-center z-50 bg-slate-950/90 backdrop-blur-md">
                <div className="text-center p-8">
                  <div className="text-7xl mb-5">✨</div>

                  <div className={`inline-flex items-center gap-2 px-4 py-2 rounded-2xl border ${
                    isMilestone
                      ? "border-yellow-400/50 bg-yellow-500/10 text-yellow-200 shadow-[0_0_20px_rgba(250,204,21,0.18)]"
                      : "border-white/20 bg-white/10 text-white"
                  }`}>
                    {isMilestone && <Icon name="crown" size={18} className="text-yellow-300" />}
                    <span className="text-2xl font-black tabular-nums">Lv. {level}</span>
                  </div>

                  <h2 className="text-5xl font-black text-yellow-400 italic mt-4 mb-3">LEVEL UP!</h2>

                  <div className="text-base font-black text-slate-200">
                    {profile.title} に しんかした！
                  </div>

                  <div className="mt-4 inline-flex items-center gap-3 px-5 py-3 rounded-2xl border border-white/15 bg-white/5">
                    <img src={avatarUrl} alt={`Wake Lv${level}`} className="w-14 h-14 rounded-xl border border-white/20" />
                    <div className="text-left">
                      <div className="text-xs font-black text-slate-400">キャラクターが成長！</div>
                      <div className="text-sm font-black text-white">見た目がレベルで変わります</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
