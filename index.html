<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>和敬くんの冒険ギルド</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- favicon（404を消したいなら assets/favicon.png を置いて有効化）
  <link rel="icon" href="./assets/favicon.png" type="image/png" />
  -->

  <style>
    body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // React管理のシンプルSVGアイコン（Lucide互換っぽい線画）
    const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
      const common = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        xmlns: "http://www.w3.org/2000/svg",
        stroke: "currentColor",
        strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className
      };

      switch (name) {
        case "sword":
          return (
            <svg {...common}>
              <path d="M14.5 5.5l4 4" />
              <path d="M5 19l4-4" />
              <path d="M6.5 17.5l10-10" />
              <path d="M12 8l4 4" />
              <path d="M4 20l3-1 1-3-3 1-1 3z" />
            </svg>
          );
        case "star":
          return (
            <svg {...common}>
              <path d="M12 2l2.9 6.1 6.7.6-5 4.3 1.5 6.5L12 16.9 5.9 19.5 7.4 13 2.4 8.7l6.7-.6L12 2z" />
            </svg>
          );
        case "trophy":
          return (
            <svg {...common}>
              <path d="M8 4h8v3a4 4 0 0 1-8 0V4z" />
              <path d="M6 4H4v2a4 4 0 0 0 4 4" />
              <path d="M18 4h2v2a4 4 0 0 1-4 4" />
              <path d="M12 11v4" />
              <path d="M8 21h8" />
              <path d="M10 15h4v6h-4z" />
            </svg>
          );
        case "home":
          return (
            <svg {...common}>
              <path d="M3 11l9-8 9 8" />
              <path d="M5 10v10h14V10" />
            </svg>
          );
        case "play":
          return (
            <svg {...common}>
              <path d="M8 5l11 7-11 7V5z" />
            </svg>
          );
        case "settings":
          return (
            <svg {...common}>
              <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
              <path d="M19.4 15a7.8 7.8 0 0 0 .1-2l2-1.2-2-3.5-2.3.7a7.2 7.2 0 0 0-1.7-1l-.3-2.4H9.8L9.5 8a7.2 7.2 0 0 0-1.7 1L5.5 8.3l-2 3.5 2 1.2a7.8 7.8 0 0 0 .1 2l-2 1.2 2 3.5 2.3-.7a7.2 7.2 0 0 0 1.7 1l.3 2.4h4.4l.3-2.4a7.2 7.2 0 0 0 1.7-1l2.3.7 2-3.5-2-1.2z" />
            </svg>
          );
        case "gift":
          return (
            <svg {...common}>
              <path d="M20 12v10H4V12" />
              <path d="M2 7h20v5H2V7z" />
              <path d="M12 7v15" />
              <path d="M12 7c-1.8 0-3-1-3-2.3C9 3.3 10.2 2 12 4c1.8-2 3-0.7 3 0.7C15 6 13.8 7 12 7z" />
            </svg>
          );
        case "check-circle-2":
          return (
            <svg {...common}>
              <path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z" />
              <path d="M7 12l3 3 7-7" />
            </svg>
          );
        default:
          return <span className={className} style={{ width: size, height: size, display: "inline-block" }} />;
      }
    };

    const INITIAL_TASKS = [
      { id: 1, text: "あさごはんを たべる", xp: 50, completed: false, icon: "🍳" },
      { id: 2, text: "はみがきを する", xp: 30, completed: false, icon: "🪥" },
      { id: 3, text: "おきがえを する", xp: 40, completed: false, icon: "👕" },
      { id: 4, text: "おもちゃを かたづける", xp: 60, completed: false, icon: "🧸" },
      { id: 5, text: "しゅくだい/おべんきょう", xp: 100, completed: false, icon: "✏️" },
      { id: 6, text: "おふろに はいる", xp: 50, completed: false, icon: "🛁" },
    ];

    const RewardItem = ({ levelRequired, currentLevel, icon, label }) => {
      const isUnlocked = currentLevel >= levelRequired;
      return (
        <div className="flex flex-col items-center gap-2">
          <div
            className={`flex-shrink-0 w-20 h-20 rounded-2xl flex items-center justify-center border-2 transition-all duration-500 ${
              isUnlocked
                ? "bg-yellow-500/10 border-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.2)]"
                : "bg-slate-900 border-slate-800 text-slate-700"
            }`}
          >
            {isUnlocked ? (
              <span className="text-4xl">{icon}</span>
            ) : (
              <div className="flex flex-col items-center">
                <Icon name="gift" size={24} className="opacity-20 text-white" />
                <span className="text-[10px] font-black mt-1">Lv.{levelRequired}</span>
              </div>
            )}
          </div>
          <span className={`text-[10px] font-bold ${isUnlocked ? "text-yellow-500" : "text-slate-600"}`}>
            {isUnlocked ? label : "???"}
          </span>
        </div>
      );
    };

    const App = () => {
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [totalXp, setTotalXp] = useState(0);
      const [level, setLevel] = useState(1);
      const [showLevelUp, setShowLevelUp] = useState(false);

      const completedCount = useMemo(() => tasks.filter(t => t.completed).length, [tasks]);

      useEffect(() => {
        const newLevel = Math.floor(totalXp / 200) + 1;
        if (newLevel > level) {
          setLevel(newLevel);
          setShowLevelUp(true);
          triggerConfetti();
          setTimeout(() => setShowLevelUp(false), 3000);
        }
      }, [totalXp, level]);

      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ["#FFD700", "#FFA500", "#FF4500", "#FFFFFF"],
          });
        }
      };

      const toggleTask = (id) => {
        setTasks(prev =>
          prev.map(task => {
            if (task.id === id && !task.completed) {
              setTotalXp(x => x + task.xp);
              triggerConfetti();
              return { ...task, completed: true };
            }
            return task;
          })
        );
      };

      const resetQuests = () => {
        if (window.confirm("あしたの ぼうけんに そなえて、クエストを リセットする？")) {
          setTasks(INITIAL_TASKS.map(t => ({ ...t, completed: false })));
        }
      };

      const xpInLevel = totalXp % 200;
      const xpProgress = (xpInLevel / 200) * 100;

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans p-4 pb-28 md:p-8 flex justify-center items-start">
          <div className="max-w-md w-full space-y-6">

            {/* ステータス */}
            <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-[2rem] p-6 shadow-2xl border-b-4 border-slate-700 relative overflow-hidden">
              <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none text-white">
                <Icon name="sword" size={120} />
              </div>

              <div className="flex items-center space-x-4 mb-6 relative z-10">
                <div className="w-20 h-20 bg-blue-600 rounded-2xl border-4 border-slate-700 flex items-center justify-center shadow-inner overflow-hidden transform -rotate-3">
                  <img
                    src="https://api.dicebear.com/7.x/adventurer/svg?seed=Wake&backgroundColor=b6e3f4"
                    alt="Wake"
                    className="w-full h-full object-cover"
                  />
                </div>

                <div>
                  <h1 className="text-2xl font-black text-white">ゆうしゃ 和敬</h1>
                  <div className="flex items-center gap-2 text-xs font-bold uppercase text-slate-400">
                    <span className="bg-blue-500/20 text-blue-400 px-2 py-0_ATTACHMENT py-0.5 rounded border border-blue-500/30">
                      Lv. {level}
                    </span>
                    <span>ADVENTURER</span>
                  </div>
                </div>
              </div>

              <div className="space-y-2 relative z-10">
                <div className="flex justify-between text-[10px] font-black uppercase tracking-widest text-slate-400">
                  <span>Next Level</span>
                  <span className="text-yellow-500">{xpInLevel} / 200 XP</span>
                </div>

                <div className="h-5 bg-slate-950/50 rounded-full border border-slate-700 p-1">
                  <div
                    className="h-full bg-gradient-to-r from-blue-500 via-yellow-400 to-orange-500 rounded-full transition-all duration-1000 shadow-[0_0_15px_rgba(251,191,36,0.3)]"
                    style={{ width: `${xpProgress}%` }}
                  ></div>
                </div>
              </div>
            </div>

            {/* クエストリスト */}
            <div className="space-y-4">
              <div className="flex justify-between items-end px-2">
                <h2 className="text-2xl font-black text-white">今日のクエスト</h2>
                <div className="bg-slate-800/50 px-4 py-1.5 rounded-xl border border-slate-700 text-sm font-black">
                  {completedCount} / {tasks.length}
                </div>
              </div>

              <div className="grid gap-4">
                {tasks.map((task) => (
                  <button
                    key={task.id}
                    onClick={() => toggleTask(task.id)}
                    disabled={task.completed}
                    className={`group flex items-center p-5 rounded-[1.5rem] border-b-4 transition-all duration-200 active:translate-y-1 active:border-b-0 ${
                      task.completed
                        ? "bg-emerald-950/20 border-emerald-900/10 opacity-60"
                        : "bg-slate-800 border-slate-950"
                    }`}
                  >
                    <div className="text-4xl mr-5 w-16 h-16 flex items-center justify-center rounded-2xl bg-slate-700">
                      {task.icon}
                    </div>

                    <div className="flex-1 text-left">
                      <div className={`text-lg font-bold ${task.completed ? "line-through text-slate-500" : "text-slate-100"}`}>
                        {task.text}
                      </div>
                      <div
                        className={`text-xs font-black mt-1 flex items-center gap-1 ${
                          task.completed ? "text-slate-600" : "text-yellow-500"
                        }`}
                      >
                        <Icon name="star" size={14} className="inline-block" /> +{task.xp} XP
                      </div>
                    </div>

                    {task.completed ? (
                      <div className="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white">
                        <Icon name="check-circle-2" size={24} className="text-white" strokeWidth={3} />
                      </div>
                    ) : (
                      <div className="w-10 h-10 rounded-full border-4 border-slate-700"></div>
                    )}
                  </button>
                ))}
              </div>
            </div>

            {/* 報酬 */}
            <div className="bg-indigo-900/20 rounded-[2rem] p-6 border border-indigo-500/20 relative overflow-hidden">
              <h2 className="text-lg font-black mb-4 flex items-center gap-2 text-indigo-300">
                <Icon name="trophy" size={20} className="text-yellow-500" /> クリア報酬
              </h2>

              <div className="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
                <RewardItem levelRequired={1} currentLevel={level} icon="🍦" label="アイス" />
                <RewardItem levelRequired={5} currentLevel={level} icon="🎮" label="ゲーム" />
                <RewardItem levelRequired={10} currentLevel={level} icon="🎁" label="ひみつ" />
              </div>
            </div>

            {/* 下部メニュー */}
            <div className="fixed bottom-6 left-4 right-4 max-w-md mx-auto z-40">
              <div className="bg-slate-900/80 backdrop-blur-xl rounded-[2.5rem] p-4 border border-slate-700/50 flex justify-around">
                <button className="p-4 bg-blue-600 rounded-2xl text-white">
                  <Icon name="home" size={28} />
                </button>
                <button onClick={resetQuests} className="p-4 text-slate-500">
                  <Icon name="play" size={28} />
                </button>
                <button className="p-4 text-slate-500">
                  <Icon name="settings" size={28} />
                </button>
              </div>
            </div>

            {/* レベルアップ */}
            {showLevelUp && (
              <div className="fixed inset-0 flex items-center justify-center z-50 bg-slate-950/90 backdrop-blur-md">
                <div className="text-center p-8">
                  <div className="text-8xl mb-6">✨</div>
                  <h2 className="text-6xl font-black text-yellow-500 italic mb-4">LEVEL UP!</h2>
                  <div className="bg-white/10 px-6 py-3 rounded-2xl border border-white/20 inline-block text-2xl font-bold text-white">
                    冒険ランクが上がった！
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
